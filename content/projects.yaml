- slug: credit-card-fraud-detection
  title: Credit Card Fraud Detection
  org: Personal project
  tags: [Classic ML]
  summary: >-
    Flags fraudulent card transactions in a public, anonymised dataset where fraud
    is under 1% of records. Handles extreme class imbalance with resampling and
    class weights, and judges models by precision, recall and PR-AUC — because 99%
    accuracy can mean catching no fraud at all.
  stack: [Python, Pandas, scikit-learn, Matplotlib]
  badge: Code not public

- slug: diabetes-prediction
  title: Diabetes Prediction
  org: Personal project
  tags: [Classic ML, Healthcare]
  summary: >-
    Predicts diabetes risk from clinical measurements such as glucose, blood
    pressure, BMI, insulin and age. Cleans physiologically impossible zero values,
    scales features and compares classifiers with a focus on recall — a missed
    diagnosis costs more than a false alarm.
  stack: [Python, Pandas, scikit-learn]
  badge: Code not public
