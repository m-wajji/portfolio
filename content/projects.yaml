    - {value: "0.928", label: recall @ 0.4}
    - {value: "0.887", label: precision}
  stack: [YOLO26, Ultralytics, OpenCV, Streamlit, pytest, Colab T4]
  image: img/dental-predictions.jpg
  image_alt: Grid of intraoral photos with caries detections drawn as boxes and confidence scores
  links:
    - {label: Code, url: https://github.com/m-wajji/dental-caries-yolo}
    - {label: Live demo, url: "#demo"}

