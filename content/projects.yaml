- slug: dental-caries-detection
  title: Dental Caries Detection
  org: Personal project
  year: 2026
  featured: true
  tags: [Vision, Healthcare]
  summary: >-
    YOLO26 detector that finds tooth decay in intraoral phone photos. Trained on
    2,227 dentist-annotated images, split by patient to prevent leakage, with a
    screening threshold tuned for recall.
  metrics:
