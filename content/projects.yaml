- slug: baby-cry-analyzer
  title: Baby Cry Analyzer
  org: Team project
  tags: [Audio, Classic ML]
  summary: >-
    Classifies an infant's cry into five needs — hungry, tired, belly pain, burping,
    discomfort — from a 56-value audio fingerprint (40 MFCCs plus chroma, spectral
    and energy features). Minority classes balanced with audio augmentation; a
    Random Forest served by Flask to a Next.js frontend.
  metrics:
    - {value: "72%", label: accuracy · 5 classes}
  lesson: >-
    Augmenting before splitting lets variants of the same cry land in train and
    test and inflates the score — the reason I split by patient in the dental project.
  stack: [librosa, scikit-learn, Flask, Next.js, Tailwind]
  links:
    - {label: Code, url: https://github.com/waliyasuleman/baby-cry-analyzer}
  badge: Team project

