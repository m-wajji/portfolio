<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ profile.name }} — {{ profile.role }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ profile.description }}{% endblock %}">
  <link rel="canonical" href="{{ profile.site_url }}{{ page_path }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ profile.site_url }}{{ page_path }}">
  <meta property="og:image" content="{{ profile.site_url }}/static/img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0B0F14">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/site.css?v={{ build_id }}">
  <script>
    document.documentElement.classList.add('js');
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Person","name":"{{ profile.name }}","jobTitle":"{{ profile.role }}",
   "url":"{{ profile.site_url }}","email":"mailto:{{ profile.email }}",
   "sameAs":[{% for l in profile.links if l.url.startswith('http') %}"{{ l.url }}"{{ "," if not loop.last }}{% endfor %}]}
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip" href="#main">Skip to content</a>
  <canvas id="graph-bg" aria-hidden="true"></canvas>
  <div class="spotlight" aria-hidden="true"></div>

  <button class="theme-toggle" type="button" aria-label="Toggle light and dark theme">
    <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
  </button>

  {% block body %}{% endblock %}

  {% include "partials/chat.html" %}
  <script src="/static/js/main.js?v={{ build_id }}" defer></script>
  <script src="/static/js/chat.js?v={{ build_id }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
